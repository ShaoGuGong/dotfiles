shell fish
editor nvim

# cursor_shape block
# cursor_trail 1
# cursor_trail_start_threshold 0
shell_integration no-cursor

allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten /home/shaogu/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Browse scrollback buffer in nvim
map kitty_mod+x kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

tab_bar_edge bottom
tab_bar_style slant
# tab_bar_background #727169
tab_bar_style separator
tab_separator " ┃ "
tab_activity_symbol " "

font_size 14.0


# BEGIN_KITTY_FONTS
font_family      family="Maple Mono NF CN"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

background_opacity 0.9
background_blur 10
dynamic_background_opacity yes
map ctrl+shift+0 change_font_size all 0
map ctrl+alt+equal set_background_opacity +0.1
map ctrl+alt+minus set_background_opacity -0.1
map ctrl+alt+0 set_background_opacity default
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab

# BEGIN_KITTY_THEME
# Kanagawa
include current-theme.conf
# END_KITTY_THEME
